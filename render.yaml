services:
  - type: web
    name: docgen-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: docgen-db
          property: connectionString
      # Required for AI generation — a DeepSeek key from
      # https://platform.deepseek.com/api_keys. sync: false means Render
      # prompts for it during Blueprint setup instead of deploying blank.
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.deepseek.com
      - key: AI_MODEL
        value: deepseek-flash
      # Google OAuth Web client ID (see README > Google sign-in).
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Payment provider variables — all optional. Leave blank in the
      # Blueprint setup screen and fill in later (Environment tab) once
      # you've registered with each provider; see README > Plans & billing.
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_PRICE_ID
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_ENVIRONMENT
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PAYME_MERCHANT_ID
        sync: false
      - key: PAYME_KEY
        sync: false
      - key: PAYME_CHECKOUT_URL
        sync: false
      - key: CLICK_SERVICE_ID
        sync: false
      - key: CLICK_MERCHANT_ID
        sync: false
      - key: CLICK_SECRET_KEY
        sync: false

databases:
  - name: docgen-db
    plan: free
